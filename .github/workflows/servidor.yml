# Despliega el servidor online en Fly.io cuando cambian el servidor o la simulación.
# Necesita el secreto FLY_API_TOKEN en Settings → Secrets and variables → Actions.
# Sin ese secreto, el flujo solo ejecuta las pruebas y omite el despliegue.
name: Servidor (Fly.io)

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'juego/src/data.js'
      - 'juego/src/terrain.js'
      - 'juego/src/sim.js'
      - 'juego/src/systems/**'
      - 'juego/src/version.js'
      - 'fly.toml'
      - '.dockerignore'
      - 'test/**'
      - '.github/workflows/servidor.yml'
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

env:
  APP: ecos-de-valdoria

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pruebas antes de desplegar
        run: |
          node test/sim.test.js
          (cd server && npm install --no-audit --no-fund)
          node test/server.test.js

      - name: Comprobar token de Fly.io
        id: token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning::Falta el secreto FLY_API_TOKEN. Las pruebas pasaron, pero no se despliega."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.token.outputs.skip != 'true'

      - name: Crear la app si no existe
        if: steps.token.outputs.skip != 'true'
        run: flyctl status --app "$APP" > /dev/null 2>&1 || flyctl apps create "$APP" --org personal

      - name: Disco persistente (registro de nombres)
        if: steps.token.outputs.skip != 'true'
        run: |
          if ! flyctl volumes list --app "$APP" --json | jq -e '.[] | select(.name == "valdoria_data")' > /dev/null; then
            echo "Creando el disco valdoria_data (1 GB) en gru"
            flyctl volumes create valdoria_data --region gru --size 1 --app "$APP" --yes
            # Las máquinas creadas antes del disco no lo tienen montado: se recrean en el despliegue
            for id in $(flyctl machine list --app "$APP" --json | jq -r '.[].id'); do
              flyctl machine destroy "$id" --force --app "$APP"
            done
          fi

      # Contraseña del panel /admin: se toma del secreto ADMIN_PASSWORD de GitHub (si existe)
      - name: Contraseña del panel de control
        if: steps.token.outputs.skip != 'true'
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -n "$ADMIN_PASSWORD" ]; then
            flyctl secrets set ADMIN_PASSWORD="$ADMIN_PASSWORD" --stage --app "$APP"
          else
            echo "::warning::Falta el secreto ADMIN_PASSWORD: el panel /admin queda cerrado."
          fi

      - name: Desplegar
        if: steps.token.outputs.skip != 'true'
        run: flyctl deploy --remote-only --ha=false --app "$APP"

      - name: Comprobar que responde
        if: steps.token.outputs.skip != 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://$APP.fly.dev/status"; then exit 0; fi
            sleep 10
          done
          echo "::error::El servidor no responde en https://$APP.fly.dev/status"
          exit 1
