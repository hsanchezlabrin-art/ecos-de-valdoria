# Despliega el servidor online en Fly.io cuando cambian el servidor o la simulación.
# Necesita el secreto FLY_API_TOKEN en Settings → Secrets and variables → Actions.
# Sin ese secreto, el flujo solo ejecuta las pruebas y omite el despliegue.
name: Servidor (Fly.io)

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'juego/src/data.js'
      - 'juego/src/terrain.js'
      - 'juego/src/sim.js'
      - 'fly.toml'
      - '.dockerignore'
      - '.github/workflows/servidor.yml'
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

env:
  APP: ecos-de-valdoria

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pruebas antes de desplegar
        run: |
          node test/sim.test.js
          (cd server && npm install --no-audit --no-fund)
          node test/server.test.js

      - name: Comprobar token de Fly.io
        id: token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning::Falta el secreto FLY_API_TOKEN. Las pruebas pasaron, pero no se despliega."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.token.outputs.skip != 'true'

      - name: Crear la app si no existe
        if: steps.token.outputs.skip != 'true'
        run: flyctl status --app "$APP" > /dev/null 2>&1 || flyctl apps create "$APP" --org personal

      - name: Desplegar
        if: steps.token.outputs.skip != 'true'
        run: flyctl deploy --remote-only --ha=false --app "$APP"

      - name: Comprobar que responde
        if: steps.token.outputs.skip != 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://$APP.fly.dev/status"; then exit 0; fi
            sleep 10
          done
          echo "::error::El servidor no responde en https://$APP.fly.dev/status"
          exit 1
