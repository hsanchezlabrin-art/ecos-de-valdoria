# Ejecuta la simulación del juego en Node y el servidor online en cada push.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  simulacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Simulación sin gráficos
        run: node test/sim.test.js
      - name: Instalar dependencias del servidor
        working-directory: server
        run: npm install --no-audit --no-fund
      - name: Servidor online con dos jugadores
        run: node test/server.test.js
