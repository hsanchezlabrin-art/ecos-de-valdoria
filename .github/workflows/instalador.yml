# Compila los instaladores de Windows y macOS y los publica como Release.
# Se ejecuta al subir una etiqueta de versión (git tag v0.3.0 && git push origin v0.3.0)
# o a mano desde la pestaña Actions de GitHub.
name: Instaladores

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            file: desktop/dist/EcosDeValdoria-Setup.exe
          - os: macos-latest
            target: --mac
            file: desktop/dist/EcosDeValdoria-Mac.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Copiar el juego dentro de la app
        shell: bash
        run: |
          cp -R juego desktop/app
          if [ "${{ github.ref_type }}" = "tag" ]; then
            (cd desktop && npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version)
          fi

      - name: Instalar dependencias
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Compilar
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.os }}
          path: ${{ matrix.file }}

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Ecos de Valdoria ${{ github.ref_name }}
          files: |
            dist/EcosDeValdoria-Setup.exe
            dist/EcosDeValdoria-Mac.dmg
          make_latest: true
          body: |
            **Windows 10 y 11 (64 bits)** · `EcosDeValdoria-Setup.exe` · no requiere permisos de administrador.
            Si Windows muestra «Windows protegió su PC», pulsa **Más información → Ejecutar de todas formas**.

            **macOS 11 o superior (Apple Silicon e Intel)** · `EcosDeValdoria-Mac.dmg`.
            Abre el .dmg y arrastra el juego a Aplicaciones. Como la app aún no está firmada por Apple, la primera vez:
            haz clic derecho sobre el juego → **Abrir** → **Abrir**. Si macOS dice que la app «está dañada», abre Terminal y ejecuta:
            `xattr -cr "/Applications/Ecos de Valdoria.app"`

            Guía del juego: https://ecos-de-valdoria.vercel.app/guia.html
