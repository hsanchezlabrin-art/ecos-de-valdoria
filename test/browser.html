<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pruebas de la simulación (navegador)</title>
<style>body { font: 14px/1.5 ui-monospace, Consolas, monospace; background: #111; color: #ddd; padding: 16px; } .ok { color: #8fd37a; } .err { color: #ff8b78; white-space: pre-wrap; }</style>
</head>
<body>
<h1>Pruebas de la simulación</h1>
<p>Ejecuta <code>test/sim.test.js</code> en el navegador (para cuando no hay Node a mano).</p>
<pre id="out"></pre>
<script>
  // Carga los archivos sin caché (siempre la versión actual)
  const load = (src) => new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = `${src}?t=${Date.now()}`;
    s.onload = res;
    s.onerror = rej;
    document.head.append(s);
  });
  (async () => {
    for (const f of ['data', 'terrain', 'sim']) await load(`../juego/src/${f}.js`);
    run();
  })();
  function run() {
  const out = document.getElementById('out');
  const print = (t, cls) => {
    const s = document.createElement('span');
    if (cls) s.className = cls;
    s.textContent = t + '\n';
    out.append(s);
  };
  const shim = {
    assert: { ok: (c, m) => { if (!c) throw new Error('Falló: ' + m); } },
    '../juego/src/sim.js': V.Sim,
    '../juego/src/data.js': V.Data,
    '../juego/src/terrain.js': V.Terrain,
  };
  window.require = (k) => shim[k];
  const realLog = console.log;
  console.log = (...a) => { print(a.join(' '), String(a[0]).includes('✓') ? 'ok' : ''); realLog(...a); };
  fetch('sim.test.js?' + Date.now())
    .then((r) => r.text())
    .then((code) => {
      const t0 = performance.now();
      try {
        new Function('require', code)(window.require);
        print(`Terminado en ${Math.round(performance.now() - t0)} ms`, 'ok');
        document.title = 'OK';
      } catch (e) {
        print(e.stack || e.message, 'err');
        document.title = 'ERROR';
      }
    });
  }
</script>
</body>
</html>
