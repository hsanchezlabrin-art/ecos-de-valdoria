<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'">
<title>Ecos de Valdoria</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  /* Splash: misma pizarra oscura, filo de bronce y oro del HUD del juego. */
  :root {
    --edge: #8a6d3b;
    --edge-soft: rgba(138, 109, 59, 0.45);
    --gold: #d9b56a;
    --parch: #ecdfc4;
    --muted: #a39a86;
    --xp: #c9a54a;
    --display: 'Cinzel', 'Trajan Pro', Georgia, serif;
    --body: 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    overflow: hidden;
    user-select: none;
    -webkit-app-region: drag;
    cursor: default;
    font-family: var(--body);
    color: var(--parch);
    background: radial-gradient(ellipse at 50% 30%, #232832 0%, #12151a 55%, #08090b 100%);
  }
  .frame {
    position: absolute;
    inset: 8px;
    border: 1px solid var(--edge);
    box-shadow: inset 0 0 0 1px #000, inset 0 0 0 4px rgba(0,0,0,.6), inset 0 0 0 5px var(--edge-soft);
    pointer-events: none;
  }
  .corner { position: absolute; width: 18px; height: 18px; border-color: var(--gold); border-style: solid; }
  .tl { top: 4px; left: 4px; border-width: 2px 0 0 2px; }
  .tr { top: 4px; right: 4px; border-width: 2px 2px 0 0; }
  .bl { bottom: 4px; left: 4px; border-width: 0 0 2px 2px; }
  .br { bottom: 4px; right: 4px; border-width: 0 2px 2px 0; }

  /* Brasas que suben, como las de las fogatas de la aldea */
  .embers { position: absolute; inset: 0; overflow: hidden; }
  .embers i {
    position: absolute; bottom: -10px; width: 3px; height: 3px; border-radius: 50%;
    background: #ffb35a; box-shadow: 0 0 6px 2px rgba(255,140,60,.55);
    animation: rise linear infinite; opacity: 0;
  }
  @keyframes rise {
    0% { transform: translate(0, 0); opacity: 0; }
    10% { opacity: .9; }
    100% { transform: translate(var(--dx), -380px); opacity: 0; }
  }

  main {
    position: relative;
    height: 100%;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 4px;
    padding: 0 56px;
    text-align: center;
  }
  .emblem {
    width: 74px; height: 74px; display: grid; place-items: center; margin-bottom: 10px;
    border: 1px solid var(--edge); border-radius: 50%;
    background: radial-gradient(circle at 50% 35%, #2a2f38, #101216);
    box-shadow: 0 0 0 4px #0b0d10, 0 0 0 5px var(--edge-soft), 0 0 46px rgba(217,181,106,.22);
    font: 700 36px var(--display); color: var(--gold);
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px #0b0d10, 0 0 0 5px var(--edge-soft), 0 0 64px rgba(217,181,106,.38); } }
  .eyebrow { margin: 0; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 0 0 18px; font: 700 44px/1 var(--display); letter-spacing: .06em; color: var(--gold); text-shadow: 0 4px 24px rgba(0,0,0,.7); }
  .track { width: 340px; height: 9px; background: #07080a; border: 1px solid #000; box-shadow: 0 0 0 1px var(--edge-soft); overflow: hidden; }
  .track i { display: block; height: 100%; transform: scaleX(.03); transform-origin: left; background: linear-gradient(#e6c773, var(--xp) 55%, #8a6d3b); transition: transform .4s ease; }
  #status { margin: 10px 0 0; min-height: 1.4em; font-size: 15px; font-style: italic; color: var(--muted); }
  footer { position: absolute; left: 22px; right: 22px; bottom: 16px; display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: rgba(163,154,134,.7); }
</style>
</head>
<body>
  <div class="embers" id="embers"></div>
  <div class="frame"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span></div>
  <main>
    <div class="emblem" aria-hidden="true">V</div>
    <p class="eyebrow">Ecos de</p>
    <h1>Valdoria</h1>
    <div class="track"><i id="bar"></i></div>
    <p id="status">Abriendo las puertas de Brezal…</p>
  </main>
  <footer><span>Aldea de Brezal</span><span id="ver"></span></footer>
<script>
  const embers = document.getElementById('embers');
  for (let i = 0; i < 22; i++) {
    const e = document.createElement('i');
    e.style.left = `${Math.random() * 100}%`;
    e.style.setProperty('--dx', `${(Math.random() - 0.5) * 80}px`);
    e.style.animationDuration = `${4 + Math.random() * 5}s`;
    e.style.animationDelay = `${Math.random() * 6}s`;
    embers.append(e);
  }
  const bar = document.getElementById('bar');
  const status = document.getElementById('status');
  if (window.splash) {
    window.splash.getVersion().then((v) => (document.getElementById('ver').textContent = `v${v}`));
    window.splash.onProgress(({ text, pct }) => {
      status.textContent = text;
      bar.style.transform = `scaleX(${Math.max(0.03, Math.min(1, pct))})`;
    });
  }
</script>
</body>
</html>
