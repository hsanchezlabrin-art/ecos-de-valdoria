<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'">
<title>Ecos de Valdoria</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap">
<style>
  /* Splash: misma estética vóxel cálida del juego (cielo, pasto, madera y oro). */
  :root {
    --wood: #a86c33; --wood-hi: #d39a55; --wood-lo: #7a4a1f; --wood-dk: #3f250f;
    --gold: #ffc83d; --gold-hi: #ffe999; --gold-lo: #e09a16;
    --display: 'Lilita One', 'Arial Rounded MT Bold', system-ui, sans-serif;
    --body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    overflow: hidden; user-select: none; -webkit-app-region: drag; cursor: default;
    font-family: var(--body); font-weight: 700; color: #fff;
    background: linear-gradient(180deg, #5cc4ff 0%, #7fd3ff 38%, #d9f3ff 64%, #b7e88a 64.4%, #6cc33e 74%, #3f8a24 100%);
  }
  /* Marco de madera con esquinas doradas */
  .frame { position: absolute; inset: 0; border: 10px solid var(--wood); box-shadow: inset 0 0 0 3px var(--wood-dk), inset 0 0 0 6px var(--gold-lo), 0 0 0 2px var(--wood-dk); pointer-events: none; }
  .corner { position: absolute; width: 22px; height: 22px; background: var(--gold); border: 3px solid var(--wood-dk); box-shadow: inset 0 3px 0 var(--gold-hi); }
  .tl { top: -12px; left: -12px; } .tr { top: -12px; right: -12px; } .bl { bottom: -12px; left: -12px; } .br { bottom: -12px; right: -12px; }
  /* Nubes de bloques que pasan */
  .embers { position: absolute; inset: 0; overflow: hidden; }
  .embers i { position: absolute; height: 18px; background: #fff; box-shadow: 14px -10px 0 #fff, 30px 0 0 #fff; opacity: .9; animation: drift linear infinite; }
  @keyframes drift { from { transform: translateX(-120px); } to { transform: translateX(760px); } }
  main { position: relative; height: 100%; display: grid; place-content: center; justify-items: center; gap: 6px; padding: 0 56px; text-align: center; }
  .emblem { width: 96px; height: 96px; filter: drop-shadow(0 5px 0 rgba(63,37,15,.35)); animation: bob 2.4s ease-in-out infinite; }
  .emblem svg { width: 100%; height: 100%; }
  @keyframes bob { 50% { transform: translateY(-5px); } }
  .logo { display: grid; justify-items: center; line-height: .92; margin: 0 0 12px; font-family: var(--display); font-weight: 400; text-transform: uppercase; }
  .logo span { position: relative; display: block; color: var(--wood-dk); -webkit-text-stroke: .17em var(--wood-dk); text-shadow: 0 .09em 0 var(--wood-dk); }
  .logo span::after { content: attr(data-t); position: absolute; left: 0; top: 0; right: 0; -webkit-text-stroke: 0; text-shadow: none; color: transparent; -webkit-background-clip: text; background-clip: text; }
  .logo .l1 { font-size: 26px; } .logo .l1::after { background-image: linear-gradient(180deg, #d8f6ff, #6fcbff 40%, #2a86e8 72%, #1a5fc0); }
  .logo .l2 { font-size: 48px; } .logo .l2::after { background-image: linear-gradient(180deg, #fff8c0, #ffd34a 40%, #ffb21e 70%, #e07010); }
  .track { width: 360px; height: 26px; border: 4px solid var(--wood-dk); border-radius: 10px; background: linear-gradient(180deg, #8a5a2b, #6e431d); box-shadow: 0 0 0 3px var(--gold), 0 0 0 6px var(--wood-dk); overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 5px; transform: scaleX(.03); transform-origin: left; background: linear-gradient(180deg, #fff08a, #ffc22e 55%, #c98400); transition: transform .4s ease; }
  #status { margin: 12px 0 0; min-height: 1.4em; font-size: 15px; color: #234015; text-shadow: 0 1px 0 rgba(255,255,255,.6); }
  .update { display: none; gap: 10px; justify-items: center; margin-top: 10px; -webkit-app-region: no-drag; }
  .update.show { display: grid; }
  .update p { margin: 0; font-size: 15px; color: #234015; }
  .update div { display: flex; gap: 10px; }
  .update button { font: 400 16px var(--display); letter-spacing: .03em; padding: 9px 18px; border-radius: 10px; cursor: pointer; border: 3px solid var(--wood-dk); background: linear-gradient(180deg, var(--wood-hi), var(--wood) 55%, var(--wood-lo)); color: #fff; box-shadow: 0 3px 0 var(--wood-dk); }
  .update button.gold { background: linear-gradient(180deg, var(--gold-hi), var(--gold) 45%, var(--gold-lo)); color: #2a1708; }
  .update button:hover { filter: brightness(1.08); }
  footer { position: absolute; left: 24px; right: 24px; bottom: 18px; display: flex; justify-content: space-between; font: 400 13px var(--display); letter-spacing: .06em; text-transform: uppercase; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
</style>
</head>
<body>
  <div class="embers" id="embers"></div>
  <div class="frame"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span></div>
  <main>
    <div class="emblem" aria-hidden="true"><svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="emRing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe58a"/><stop offset=".5" stop-color="#ffc83d"/><stop offset="1" stop-color="#d98a12"/></linearGradient><radialGradient id="emIn" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#3f8a35"/><stop offset="1" stop-color="#173d1a"/></radialGradient><linearGradient id="emStar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bff4ff"/><stop offset=".5" stop-color="#3fb4ff"/><stop offset="1" stop-color="#1f5fd6"/></linearGradient><clipPath id="emClip"><circle cx="64" cy="68" r="45"/></clipPath></defs><path d="M44 20 L50 6 L57 15 L64 2 L71 15 L78 6 L84 20 Z" fill="#ffc83d" stroke="#6e3f0c" stroke-width="3" stroke-linejoin="round"/><path d="M48 18 L51 10 L56 17 Z M72 17 L77 10 L80 18 Z" fill="#ffe58a"/><circle cx="64" cy="68" r="54" fill="url(#emRing)" stroke="#6e3f0c" stroke-width="4"/><circle cx="64" cy="68" r="45" fill="url(#emIn)" stroke="#6e3f0c" stroke-width="3"/><g clip-path="url(#emClip)" shape-rendering="crispEdges"><rect x="10" y="76" width="108" height="60" fill="#2f6e28"/><rect x="14" y="54" width="16" height="22" fill="#24561f"/><rect x="98" y="50" width="18" height="26" fill="#24561f"/><rect x="22" y="72" width="12" height="8" fill="#5aa83a"/><rect x="94" y="70" width="14" height="10" fill="#5aa83a"/><rect x="49.00" y="34.00" width="5.05" height="5.05" fill="#2b7a20"/><rect x="54.00" y="34.00" width="25.05" height="5.05" fill="#4fae34"/><rect x="79.00" y="34.00" width="5.05" height="5.05" fill="#2b7a20"/><rect x="44.00" y="39.00" width="5.05" height="5.05" fill="#2b7a20"/><rect x="49.00" y="39.00" width="35.05" height="5.05" fill="#4fae34"/><rect x="84.00" y="39.00" width="5.05" height="5.05" fill="#2b7a20"/><rect x="39.00" y="44.00" width="5.05" height="5.05" fill="#2b7a20"/><rect x="44.00" y="44.00" width="15.05" height="5.05" fill="#4fae34"/><rect x="59.00" y="44.00" width="5.05" height="5.05" fill="#2b7a20"/><rect x="64.00" y="44.00" width="25.05" height="5.05" fill="#4fae34"/><rect x="89.00" y="44.00" width="5.05" height="5.05" fill="#2b7a20"/><rect x="39.00" y="49.00" width="5.05" height="5.05" fill="#2b7a20"/><rect x="44.00" y="49.00" width="5.05" height="5.05" fill="#4fae34"/><rect x="49.00" y="49.00" width="10.05" height="5.05" fill="#f4c99c"/><rect x="59.00" y="49.00" width="5.05" height="5.05" fill="#4fae34"/><rect x="64.00" y="49.00" width="15.05" height="5.05" fill="#f4c99c"/><rect x="79.00" y="49.00" width="10.05" height="5.05" fill="#4fae34"/><rect x="89.00" y="49.00" width="5.05" height="5.05" fill="#2b7a20"/><rect x="34.00" y="54.00" width="10.05" height="5.05" fill="#dba272"/><rect x="44.00" y="54.00" width="5.05" height="5.05" fill="#f4c99c"/><rect x="49.00" y="54.00" width="10.05" height="5.05" fill="#2b7a20"/><rect x="59.00" y="54.00" width="10.05" height="5.05" fill="#f4c99c"/><rect x="69.00" y="54.00" width="10.05" height="5.05" fill="#2b7a20"/><rect x="79.00" y="54.00" width="5.05" height="5.05" fill="#f4c99c"/><rect x="84.00" y="54.00" width="10.05" height="5.05" fill="#dba272"/><rect x="39.00" y="59.00" width="5.05" height="5.05" fill="#dba272"/><rect x="44.00" y="59.00" width="5.05" height="5.05" fill="#f4c99c"/><rect x="49.00" y="59.00" width="5.05" height="5.05" fill="#ffffff"/><rect x="54.00" y="59.00" width="5.05" height="5.05" fill="#1e3a14"/><rect x="59.00" y="59.00" width="10.05" height="5.05" fill="#f4c99c"/><rect x="69.00" y="59.00" width="5.05" height="5.05" fill="#ffffff"/><rect x="74.00" y="59.00" width="5.05" height="5.05" fill="#1e3a14"/><rect x="79.00" y="59.00" width="5.05" height="5.05" fill="#f4c99c"/><rect x="84.00" y="59.00" width="5.05" height="5.05" fill="#dba272"/><rect x="44.00" y="64.00" width="5.05" height="5.05" fill="#f29a86"/><rect x="49.00" y="64.00" width="30.05" height="5.05" fill="#f4c99c"/><rect x="79.00" y="64.00" width="5.05" height="5.05" fill="#f29a86"/><rect x="44.00" y="69.00" width="15.05" height="5.05" fill="#f4c99c"/><rect x="59.00" y="69.00" width="10.05" height="5.05" fill="#9a4a2a"/><rect x="69.00" y="69.00" width="15.05" height="5.05" fill="#f4c99c"/><rect x="49.00" y="74.00" width="30.05" height="5.05" fill="#f4c99c"/><rect x="54.00" y="79.00" width="20.05" height="5.05" fill="#f4c99c"/><rect x="44.00" y="84.00" width="40.05" height="5.05" fill="#c98a3a"/><rect x="44.00" y="89.00" width="40.05" height="5.05" fill="#4f8a2e"/></g><g transform="translate(64 108)"><path d="M0 -17 L5 -5 L17 0 L5 5 L0 17 L-5 5 L-17 0 L-5 -5 Z" fill="url(#emStar)" stroke="#ffc83d" stroke-width="3" stroke-linejoin="round"/><path d="M0 -10 L2.5 -2.5 L0 0 Z" fill="#ffffff" opacity=".8"/></g><rect x="93.8" y="97.8" width="14" height="14" rx="2" transform="rotate(45 100.8 104.8)" fill="#ffc83d" stroke="#6e3f0c" stroke-width="2.5"/><circle cx="100.8" cy="104.8" r="2.2" fill="#8a5a1a"/><rect x="20.2" y="97.8" width="14" height="14" rx="2" transform="rotate(45 27.2 104.8)" fill="#ffc83d" stroke="#6e3f0c" stroke-width="2.5"/><circle cx="27.2" cy="104.8" r="2.2" fill="#8a5a1a"/><rect x="20.2" y="24.2" width="14" height="14" rx="2" transform="rotate(45 27.2 31.2)" fill="#ffc83d" stroke="#6e3f0c" stroke-width="2.5"/><circle cx="27.2" cy="31.2" r="2.2" fill="#8a5a1a"/><rect x="93.8" y="24.2" width="14" height="14" rx="2" transform="rotate(45 100.8 31.2)" fill="#ffc83d" stroke="#6e3f0c" stroke-width="2.5"/><circle cx="100.8" cy="31.2" r="2.2" fill="#8a5a1a"/></svg></div>
    <h1 class="logo" aria-label="Ecos de Valdoria"><span class="l1" data-t="Ecos de">Ecos de</span><span class="l2" data-t="Valdoria">Valdoria</span></h1>
    <div class="track"><i id="bar"></i></div>
    <p id="status">Encendiendo las fogatas de la aldea…</p>
    <div class="update" id="update">
      <p id="updText">Hay una versión nueva de Ecos de Valdoria.</p>
      <div><button class="gold" id="updGet">Descargar</button><button id="updPlay">Jugar igual</button></div>
    </div>
  </main>
  <footer><span>Aldea de los Bloques</span><span id="ver"></span></footer>
<script>
  const embers = document.getElementById('embers');
  for (let i = 0; i < 4; i++) {
    const e = document.createElement('i');
    e.style.top = `${6 + Math.random() * 30}%`;
    e.style.width = `${40 + Math.random() * 50}px`;
    e.style.animationDuration = `${22 + Math.random() * 18}s`;
    e.style.animationDelay = `${-Math.random() * 30}s`;
    embers.append(e);
  }
  const bar = document.getElementById('bar');
  const status = document.getElementById('status');
  if (window.splash) {
    window.splash.getVersion().then((v) => (document.getElementById('ver').textContent = `v${v}`));
    window.splash.onProgress(({ text, pct }) => {
      status.textContent = text;
      bar.style.transform = `scaleX(${Math.max(0.03, Math.min(1, pct))})`;
    });
    const upd = document.getElementById('update');
    window.splash.onUpdatePrompt(({ version }) => {
      document.getElementById('updText').textContent = `Hay una versión nueva de la app (${version}). Pulsa Descargar para bajar el instalador; el juego en sí ya está al día.`;
      status.textContent = '';
      upd.classList.add('show');
    });
    document.getElementById('updGet').onclick = () => window.splash.choose('download');
    document.getElementById('updPlay').onclick = () => {
      upd.classList.remove('show');
      window.splash.choose('play');
    };
  }
</script>
</body>
</html>
